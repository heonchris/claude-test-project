<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  body { margin: 0; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--paper, #ffffff); font-family: var(--font-sans, "Nanum Gothic", sans-serif); word-break: keep-all; }
  .cover svg { position: absolute; inset: 0; }
  .rule { stroke: var(--line, #dddddd); stroke-width: 1; }
  .slot { fill: var(--placeholder, #f2f2f2); }
  .mint { fill: var(--mint, #a8f0d4); }
  .ink { fill: var(--ink, #111111); }
  .square { rx: var(--radius-none, 0px); }
  .text { position: absolute; left: 48px; bottom: 40px; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
  .name { margin: 0; font-size: 72px; line-height: 0.95; font-weight: 800; letter-spacing: -0.03em; color: var(--ink, #111111); }
  .tag { margin: 0; font-size: 14px; line-height: 1.4; color: var(--ink-muted, #767676); }
</style>
</head>
<body>
<div class="cover">
  <!--
    blocks: mint (460 × 40, the highlighter band) · ink (176 × 220, a 4:5 card bleeding off the top) · placeholder (200 × 150, a 4:3 hero slot)
    arrangement: the slot and the ink card sit on a mint band that runs off the right edge, the way .cn-mark sits under a heading
    pattern: editorial row ("borders, not shadows"), five hairline rules in line at gap-sm pitch, a notebook page behind the blocks
    scales: gap-sm 32 pitch, gap-md 48 inset, radius-none on every block
  -->
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <line class="rule" x1="480" y1="96.5" x2="960" y2="96.5"/>
    <line class="rule" x1="480" y1="128.5" x2="960" y2="128.5"/>
    <line class="rule" x1="480" y1="160.5" x2="960" y2="160.5"/>
    <line class="rule" x1="480" y1="192.5" x2="960" y2="192.5"/>
    <line class="rule" x1="480" y1="224.5" x2="960" y2="224.5"/>
    <rect class="slot square" x="528" y="88" width="200" height="150"/>
    <rect class="mint square" x="500" y="176" width="460" height="40"/>
    <rect class="ink square" x="752" y="-20" width="176" height="220"/>
  </svg>
  <div class="text">
    <p class="name">에세이 노트<br>카드뉴스</p>
    <p class="tag">흰 종이, 검정 글자, 소제목에만 민트 형광펜. 글이 먼저 읽히는 1080 × 1350 카드.</p>
  </div>
</div>
</body>
</html>
