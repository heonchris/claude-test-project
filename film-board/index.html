<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>촬영 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 슬레이트 줄무늬 헤더 → 가로 탭 → 카드 목록. 팀 구분은 현장 테이프 색. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#F4F5F7; --ink:#16191D; --muted:#5A626C; --line:#D4D9DF;
  --accent:#D9480F; --accent-ink:#FFFFFF; --accent-soft:#FDE8DD;
  --ok:#2B8A3E; --ok-soft:#E3F4E6; --warn:#C92A2A; --warn-soft:#FDE7E7; --info-soft:#E6EEF9; --hold-soft:#FFF4D6; --hold:#9C6B00;
  --t-all:#868E96; --t-dir:#E03131; --t-prod:#F08C00; --t-cam:#1C7ED6; --t-prop:#2F9E44;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111316; --surface:#1A1D22; --sunk:#15181C; --ink:#E7EAEE; --muted:#99A1AB; --line:#2B3038;
  --accent:#FF7B3A; --accent-ink:#1A0E06; --accent-soft:#3A2117;
  --ok:#51CF66; --ok-soft:#173222; --warn:#FF6B6B; --warn-soft:#3B1C1E; --info-soft:#1B2738; --hold-soft:#33290F; --hold:#F2C14E; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.top{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.slate{height:10px;background:repeating-linear-gradient(-45deg,var(--ink) 0 14px,var(--surface) 14px 28px)}
.head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:14px 12px;flex-wrap:wrap}
.head h1{margin:0;font-size:20px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.head .subt{color:var(--muted);font-size:13px}
.me{display:flex;gap:8px;align-items:center;font-size:13px}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sync.bad{color:var(--warn)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.tabs{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px;line-height:17px}

.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:16px 6px;flex-wrap:wrap}
.bar h2{margin:0;font-size:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px 3px 8px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tape{width:12px;height:8px;border-radius:2px;display:inline-block;flex:none}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;white-space:nowrap}
.primary:disabled{opacity:.5;cursor:default}
.small{padding:4px 10px;font-size:13px}
.list{display:flex;flex-direction:column;gap:10px;padding-block:8px 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.is-new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.between{justify-content:space-between}
.pill{font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap}
.p-info{background:var(--info-soft)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-hold{background:var(--hold-soft);color:var(--hold)}
.p-ink{background:var(--ink);color:var(--bg)}
.p-mute{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.newtag{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.team{font-size:13px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.card h3{margin:0;font-size:16px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ack{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:13px}
.ack[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.mini{background:none;border:0;color:var(--muted);font-size:13px;padding:3px 4px}
.mini:hover{color:var(--ink)}
.mini.danger{color:var(--warn)}
.addline{background:none;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13px;padding:5px 10px;align-self:flex-start}
.addline:hover{color:var(--ink);border-color:var(--muted)}
.files{display:flex;gap:8px;flex-wrap:wrap}
.file{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;text-decoration:none;max-width:100%;min-width:0;background:var(--sunk)}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:120px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;max-width:100%;background:var(--sunk)}
.strip{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;margin-top:8px;font-size:14px;flex-wrap:wrap}
.strip b{color:var(--warn)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty strong{color:var(--ink);font-size:16px}
.sect{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);margin:16px 0 0;text-transform:uppercase}
.note{font-size:13px;color:var(--muted);margin:4px 0}

/* home */
.next{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.next .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);border-right:2px solid var(--accent);padding-right:14px;line-height:1.3;text-transform:uppercase}
.next .lbl b{display:block;font-size:24px;color:var(--ink);letter-spacing:0}
.next .main{min-width:0;display:flex;flex-direction:column;gap:6px}
.next .main .t{font-weight:700;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--f-mono);font-size:20px;font-weight:600}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ok)}

/* schedule */
.day summary{list-style:none;cursor:pointer}
.day summary::-webkit-details-marker{display:none}
.dhead{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center}
.dhead .when .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.dhead .when .d{font-family:var(--f-mono);font-size:19px;font-weight:600;line-height:1.2}
.dhead .when .w{font-size:13px;color:var(--muted)}
.dhead .what{min-width:0}
.dhead .what b{display:block;overflow-wrap:anywhere}
.dhead .chev{color:var(--muted);transition:transform .15s}
.day[open] .chev{transform:rotate(90deg)}
.day.today{border-color:var(--accent)}
.day.past{opacity:.75}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.sub{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sub h4{margin:0;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.line{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:start;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--sunk)}
.line .tm{font-family:var(--f-mono);font-size:13px}
.line .tx{min-width:0;overflow-wrap:anywhere}
.line .tx small{display:block;color:var(--muted);font-size:12px}
.scenechips{display:flex;gap:6px;flex-wrap:wrap}
.sc{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:13px;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* table-ish lists */
.items{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);min-width:0}
.it:first-child{border-top:0}
.it .main{min-width:0}
.it .main b{font-weight:600;overflow-wrap:anywhere}
.it .main small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.it .no{font-family:var(--f-mono);font-weight:600;min-width:52px}
.it.done .main b{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;accent-color:var(--ok);margin:0}
.ithumb{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.clickable{cursor:pointer}
.clickable:hover{background:var(--sunk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding-block:8px 20px}
.mood{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mood .pv{aspect-ratio:4/3;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:13px;max-width:100%}
.mood .pv img{width:100%;height:100%;object-fit:cover;display:block}
.mood .cap{padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;min-width:0}
.mood .cap b{font-size:14.5px}
.seg2{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;width:max-content;max-width:100%}
.seg2 button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:13.5px;color:var(--muted);font-weight:600}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.sheet{align-items:center}.panel{border-radius:16px;padding:22px}}
.panel h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);color:var(--ink);font-size:15px;width:100%;min-width:0}
.field textarea{min-height:88px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .wide{grid-column:1/-1}
.fsec{grid-column:1/-1;font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.panel .acts{justify-content:flex-end;padding-top:4px}
.err{color:var(--warn);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:520px){
  .fgrid{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .tiles .tile:last-child{grid-column:1/-1}
  .dhead{grid-template-columns:62px 1fr auto;gap:10px}
  .line{grid-template-columns:78px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="slate" aria-hidden="true"></div>
  <div class="wrap head">
    <div>
      <h1 id="title">촬영 보드</h1>
      <div class="subt" id="subtitle">일정 · 씬 · 소품 · 장비 · 변경 사항</div>
    </div>
    <div class="me"><span class="sync" id="sync">연결 중</span><button class="ghost" type="button" id="meBtn">이름 설정</button></div>
  </div>
</header>
<nav class="tabs" aria-label="보기"><div class="wrap" role="tablist" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<div class="sheet" id="sheet" hidden><form class="panel" id="form" novalidate></form></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ================= 설정 ================= */
var TEAMS=[["all","전체","--t-all"],["dir","연출","--t-dir"],["prod","제작","--t-prod"],["cam","촬영","--t-cam"],["prop","소품","--t-prop"]];
var TEAM={};TEAMS.forEach(function(t){TEAM[t[0]]={n:t[1],c:t[2]}});
var TABS=[["home","홈"],["schedule","일정"],["scenes","씬"],["props","소품"],["gear","장비"],["board","공지·변경"]];
var WD="일월화수목금토";
var DAY_ST={confirmed:["확정","p-info"],tentative:["예비일","p-hold"],changed:["변경됨","p-warn"],done:["촬영 완료","p-ok"],cancelled:["취소","p-mute"]};
var SCENE_ST={todo:["미촬영","p-mute"],shooting:["촬영 중","p-info"],done:["완료","p-ok"],reshoot:["재촬영","p-warn"],hold:["보류","p-hold"]};
var PROP_ST={need:["필요","p-warn"],finding:["구하는 중","p-hold"],secured:["확보","p-info"],onset:["현장 반입","p-ok"]};
var MEAL_ST={none:["미정","p-warn"],booked:["예약 완료","p-info"],ordered:["주문 완료","p-info"],paid:["결제 완료","p-ok"]};
var LOG_T={notice:["공지","p-info"],decision:["결정","p-ink"],change:["변경","p-warn"]};
function opts(map){return Object.keys(map).map(function(k){return [k,map[k][0]]})}
function list2(a){return a.map(function(x){return [x,x]})}

/* 폼 스키마: k, label, type, options, ph, req, wide */
var FORMS={
  day:{title:"촬영일",fields:[
    {k:"date",label:"날짜",type:"date",req:1},{k:"status",label:"상태",type:"select",options:opts(DAY_ST)},
    {k:"call",label:"콜타임 (집합)",type:"time"},{k:"wrap",label:"예상 종료",type:"time"},
    {k:"location",label:"장소",ph:"예: 남양주 조안스테이",wide:1},{k:"scenes",label:"찍을 씬",ph:"예: S#1~5",wide:1},
    {k:"crew",label:"스태프·역할·집합",type:"textarea",ph:"예: 촬영 손채환 · 사운드 정은설 / 9시 학교 집합",wide:1},
    {k:"note",label:"메모",type:"textarea",ph:"주차, 집합 위치, 우천 시 대안 등",wide:1}]},
  slot:{title:"시간대",fields:[
    {k:"date",label:"촬영일",type:"day",req:1,wide:1},{k:"start",label:"시작",type:"time"},{k:"end",label:"끝",type:"time"},
    {k:"location",label:"장소",ph:"예: 조안스테이 2층 방",wide:1},{k:"scenes",label:"씬",ph:"예: S#3, S#4",wide:1},
    {k:"note",label:"메모",type:"textarea",ph:"세팅 시간, 이동, 배우 대기 등",wide:1}]},
  meal:{title:"식사",fields:[
    {k:"date",label:"촬영일",type:"day",req:1},{k:"time",label:"시간",type:"time"},
    {k:"meal",label:"끼니",type:"select",options:list2(["아침","점심","저녁","야식","간식"])},{k:"how",label:"방법",type:"select",options:list2(["배달","식당","도시락","케이터링","편의점","각자"])},
    {k:"place",label:"가게·메뉴",ph:"예: OO김밥 / 김밥 10줄 + 라면",wide:1},
    {k:"people",label:"인원",type:"number",ph:"8"},{k:"owner",label:"담당",ph:"이름"},
    {k:"contact",label:"예약·연락처",ph:"가게 번호, 예약자 이름",wide:1},
    {k:"status",label:"상태",type:"select",options:opts(MEAL_ST)},{k:"cost",label:"금액",ph:"예: 72,000원"},
    {k:"note",label:"메모",type:"textarea",ph:"배달 도착 장소, 못 먹는 음식 등",wide:1}]},
  scene:{title:"씬",fields:[
    {k:"no",label:"씬 번호",ph:"S#1",req:1},{k:"status",label:"상태",type:"select",options:opts(SCENE_ST)},
    {k:"summary",label:"내용 요약",ph:"예: 주인공이 이삿짐을 푼다",wide:1},
    {k:"place",label:"장소 (대본상)",ph:"예: 자취방"},{k:"ie",label:"실내/실외",type:"select",options:list2(["INT.","EXT.","INT./EXT."])},
    {k:"dn",label:"시간대",type:"select",options:list2(["낮","밤","아침","저녁","새벽"])},{k:"cast",label:"등장인물",ph:"이름"},
    {k:"props",label:"필요 소품",ph:"예: 이삿짐 박스, 스탠드",wide:1},{k:"planned",label:"촬영 예정일",type:"day",wide:1},

function pad(n){return String(n).padStart(2,"0")}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function dObj(s){if(!s)return null;var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}

function api(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    var r=window.google&&google.script&&google.script.run;
    if(!r)return rej(new Error("NO_GAS"));
    r=r.withSuccessHandler(res).withFailureHandler(rej);r[fn].apply(r,args);
  });
}
function put(it){if(it&&it.id)S.items[it.id]=it}
function errCode(e){var m=String(e&&e.message||e);return /PASSCODE/.test(m)?"PASSCODE":/NO_GAS/.test(m)?"NO_GAS":"NET"}
var syncing=false;
function sync(){
  if(syncing)return Promise.resolve();syncing=true;
  return api("apiList",S.code,S.since).then(function(r){
    (r.items||[]).forEach(put);S.since=Math.max(0,r.now-5000);
    S.loaded=true;S.err=null;S.online=true;syncing=false;render();
  }).catch(function(e){
    syncing=false;var c=errCode(e);
    if(c==="PASSCODE"){S.err="PASSCODE";render();openCode();return}
    if(!S.loaded)S.err=c;S.online=false;render();
  });
}
function save(kind,data,id){
  var temp=!id;id=id||("tmp_"+Date.now()+Math.random().toString(36).slice(2,6));
  var old=S.items[id];var merged={};if(old)for(var k in old.data)merged[k]=old.data[k];for(var k2 in data)merged[k2]=data[k2];
  S.items[id]={id:id,kind:kind,data:merged,updatedAt:Date.now(),updatedBy:S.me.name,deleted:false};render();
  return api("apiSave",S.code,{id:temp?"":id,kind:kind,data:data},S.me.name).then(function(r){
    if(temp)delete S.items[id];put(r);render();return r;
  }).catch(function(e){
    if(temp)delete S.items[id];else if(old)S.items[id]=old;render();
    toast(errCode(e)==="PASSCODE"?"팀 비밀번호가 맞지 않아요.":"저장하지 못했어요. 인터넷 연결을 확인해 주세요.");throw e;
  });
}
function remove(id){
  var old=S.items[id];if(!old)return Promise.resolve();
  S.items[id]=Object.assign({},old,{deleted:true});render();
  return api("apiDelete",S.code,id,S.me.name).then(put).catch(function(){S.items[id]=old;render();toast("지우지 못했어요. 다시 시도해 주세요.")});
}

}

function fileToB64(file){
  return new Promise(function(res,rej){
    var isImg=/^image\/(jpeg|png|webp|gif)$/.test(file.type);
    var raw=function(){var r=new FileReader();r.onload=function(){res({b64:String(r.result).split(",")[1],mime:file.type||"application/octet-stream",name:file.name})};r.onerror=rej;r.readAsDataURL(file)};
    if(!isImg||file.type==="image/gif")return raw();
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1600,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      res({b64:c.toDataURL("image/jpeg",.85).split(",")[1],mime:"image/jpeg",name:file.name.replace(/\.\w+$/,"")+".jpg"});
    };
    img.onerror=function(){URL.revokeObjectURL(url);raw()};img.src=url;
  });
}
function upload(file,btn,label){
  if(file.size>25*1048576)return Promise.reject(new Error("BIG:"+file.name));
  if(btn)btn.textContent=label;
  return fileToB64(file).then(function(f){return api("apiUpload",S.code,f.name,f.mime,f.b64)});
}

function submitForm(e){
  e.preventDefault();if(S.busy||!editing)return;
  if(editing.kind==="__me")return saveMe();
  if(editing.kind==="__code")return saveCode();
  var kind=editing.kind,id=editing.id,F=FORMS[kind],form=$("#form"),btn=$("#f-submit");
  var data={},files=[],img=null;
  for(var i=0;i<F.fields.length;i++){var f=F.fields[i];if(f.sec)continue;var el=form.elements[f.k];if(!el)continue;
    if(f.type==="image"){if(el.files[0])img=el.files[0];continue}
    if(f.type==="files"){files=[].slice.call(el.files);continue}
    var v=String(el.value||"").trim();if(f.req&&!v)return fail(f.label+"을(를) 입력해 주세요.");data[f.k]=v}
  S.busy=true;btn.disabled=true;btn.textContent="저장 중";
  var old=id&&S.items[id]?JSON.parse(JSON.stringify(S.items[id].data)):null;
  data.editedAt=Date.now();
  if(!old){if(kind==="log")data.acks={};data.createdAt=Date.now();data.author=S.me.name}
  if(kind==="gear"&&!old)data.checked=false;
  var chain=Promise.resolve();
  if(img)chain=chain.then(function(){return upload(img,btn,"사진 올리는 중")}).then(function(r){data.image=r});
  if(files.length){var up=old&&old.files?old.files.slice():[];
    files.forEach(function(f,i){chain=chain.then(function(){return upload(f,btn,"파일 올리는 중 "+(i+1)+"/"+files.length)}).then(function(r){up.push(r)})});
    chain=chain.then(function(){data.files=up});}
  chain.then(function(){return save(kind,data,id)}).then(function(saved){
    var lines=diffLines(kind,old,data);
    if(lines){
      var date=data.date||(old&&old.date);
      var name=kind==="day"?"촬영 일정":kind==="slot"?"시간대":"식사";
      logChange(fmtDate(date)+" "+name+(old?" 변경":" 추가"),lines);
      if(kind==="day"&&old&&data.status==="confirmed"&&lines.some(function(l){return!/^상태/.test(l)}))save("day",{status:"changed"},saved.id).catch(function(){});
    }
    closeSheet();toast(old?"저장했어요":"추가했어요");
  }).catch(function(err){
    var m=String(err&&err.message||err);
    fail(/^BIG:/.test(m)?"‘"+m.slice(4)+"’ 파일이 25MB를 넘어요. 줄이거나 드라이브 링크로 공유해 주세요.":/PASSCODE/.test(m)?"팀 비밀번호가 맞지 않아요.":"저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.");
  });
}
function label(kind,k){var f=FORMS[kind].fields.filter(function(x){return x.k===k})[0];return f?f.label.replace(/ \(.*\)/,""):k}
function show(kind,k,v){if(!v)return"미정";if(k==="date")return fmtDate(v);if(k==="status")return((kind==="day"?DAY_ST:MEAL_ST)[v]||[v])[0];return v}
function diffLines(kind,old,data){
  var w=WATCH[kind];if(!w)return null;
  if(!old)return w.filter(function(k){return data[k]}).map(function(k){return label(kind,k)+": "+show(kind,k,data[k])});
  var out=[];w.forEach(function(k){var a=old[k]||"",b=data[k]||"";if(a!==b)out.push(label(kind,k)+": "+show(kind,k,a)+" → "+show(kind,k,b))});
  return out.length?out:null;
}

  if(!$("#sheet").hidden)closeSheet();
}
document.addEventListener("click",function(e){
  if(e.target.id==="sheet"){closeSheet();return}
  if(e.target.closest("a"))return;
  var b=e.target.closest("[data-tab],[data-goto],[data-team],[data-new],[data-edit],[data-del],[data-ack],[data-close],[data-pview],[data-sfilter],[data-act],#meBtn");
  if(!b)return;var d=b.dataset;
  if(d.tab||d.goto){S.tab=d.tab||d.goto;try{history.replaceState(null,"","#"+S.tab)}catch(x){}render();window.scrollTo(0,0)}
  else if(d.team){S.team=d.team;render()}
  else if(d.pview){S.propView=d.pview;render()}
  else if(d.sfilter){S.sceneFilter=d.sfilter;render()}
  else if(d.new){e.preventDefault();var pre={};if(d.date)pre.date=d.date;if(d.new==="day")pre.status="confirmed";if(d.new==="log")pre.team=S.me.team||"all";if(d.new==="mood"||d.new==="prop")pre.space="설아 방 (조안스테이 숙소)";openForm(d.new,null,pre)}
  else if(d.edit){e.preventDefault();var it=S.items[d.edit];if(it)openForm(it.kind,it.id)}
  else if(d.del){e.preventDefault();arm(b,"d"+d.del,function(){del(d.del)})}
  else if(d.ack){if(!S.me.name){openMe();return}var l=S.items[d.ack];if(!l)return;var on=!(l.data.acks||{})[S.me.name];
    l.data.acks=Object.assign({},l.data.acks);if(on)l.data.acks[S.me.name]=Date.now();else delete l.data.acks[S.me.name];render();
    api("apiAck",S.code,d.ack,S.me.name,on).then(function(r){put(r);render()}).catch(function(){toast("확인 표시를 저장하지 못했어요.");sync()})}
  else if("close" in d){closeSheet()}
  else if(d.act==="code")openCode();
  else if(d.act==="reset")arm(b,"reset",resetGear);
  else if(b.id==="meBtn")openMe();
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".it.clickable")){e.preventDefault();e.target.click()}
});
document.addEventListener("change",function(e){
  var id=e.target.dataset&&e.target.dataset.check;if(!id)return;
  if(!S.me.name){e.target.checked=!e.target.checked;openMe();return}
  save("gear",{checked:e.target.checked,checkedBy:e.target.checked?S.me.name:""},id).catch(function(){});
});
function resetGear(){var gs=all("gear").filter(function(g){return g.data.checked});var p=Promise.resolve();
  gs.forEach(function(g){p=p.then(function(){return save("gear",{checked:false,checkedBy:""},g.id).catch(function(){})})});
  p.then(function(){toast("체크를 모두 해제했어요")});}
$("#form").addEventListener("submit",submitForm);
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(TABS.some(function(t){return t[0]===h})){S.tab=h;render()}});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){sync();}else{S.lastSeen=Date.now();store.set("fb-seen",String(S.lastSeen))}});

/* ================= 시작 ================= */
(function boot(){
  var h=location.hash.slice(1);if(TABS.some(function(t){return t[0]===h}))S.tab=h;
  try{var me=JSON.parse(store.get("fb-me")||"null");if(me&&me.name)S.me=me}catch(e){}
  S.code=store.get("fb-code")||"";
  var seen=Number(store.get("fb-seen")||0);S.lastSeen=seen||Date.now();
  if(!seen)store.set("fb-seen",String(S.lastSeen));
  window.addEventListener("pagehide",function(){store.set("fb-seen",String(Date.now()))});
  render();sync().then(function(){if(S.loaded&&!S.me.name)openMe()});
  setInterval(function(){if(document.visibilityState==="visible")sync()},15000);
})();
</script>
</body>
</html>
